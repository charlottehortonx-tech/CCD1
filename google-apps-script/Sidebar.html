<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', 'Noto Sans Thai', sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #f8f9fa;
      padding: 12px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #e0e0e0;
      border-top-color: #F0B90B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-box {
      background: #fff0f0;
      border: 1px solid #ffcccc;
      border-radius: 8px;
      padding: 12px;
      color: #cc0000;
    }

    /* Result */
    .result-box {
      background: #fff;
      border-radius: 8px;
      padding: 14px;
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 12.5px;
      border: 1px solid #e0e0e0;
    }

    /* Status badge */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .badge-pass { background: #e6f9f0; color: #0a7a45; }
    .badge-warning { background: #fff8e6; color: #b07800; }
    .badge-fail { background: #ffe6e6; color: #cc0000; }

    .recheck-btn {
      width: 100%;
      margin-top: 12px;
      padding: 8px;
      background: #F0B90B;
      color: #1a1a1a;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .recheck-btn:hover { background: #d4a309; }
  </style>
</head>
<body>

<? if (state === 'loading') { ?>
  <div class="loading">
    <div class="spinner"></div>
    <div>กำลังตรวจสอบ...</div>
    <div style="margin-top:6px;font-size:11px;color:#999"><?= preview ?>...</div>
  </div>

<? } else if (state === 'error') { ?>
  <div class="error-box">
    <strong>❌ เกิดข้อผิดพลาด</strong><br><br>
    <?= content ?>
  </div>

<? } else { ?>
  <?
    const text = content;
    let badgeClass = 'badge-pass';
    let badgeText = '✅ PASS';
    if (text.includes('❌ FAIL') || text.includes('สถานะรวม: ❌')) {
      badgeClass = 'badge-fail'; badgeText = '❌ FAIL';
    } else if (text.includes('⚠️ WARNING') || text.includes('สถานะรวม: ⚠️')) {
      badgeClass = 'badge-warning'; badgeText = '⚠️ WARNING';
    }
  ?>
  <div class="badge <?= badgeClass ?>"><?= badgeText ?></div>
  <div class="result-box"><?= content ?></div>
  <button class="recheck-btn" onclick="google.script.run.checkCompliance()">
    🔄 ตรวจอีกครั้ง
  </button>
<? } ?>

</body>
</html>
